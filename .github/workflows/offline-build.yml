name: Build offline React Flow HTML

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Telecom_Block_Diagram_Maker_ReactFlow_Offline.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offline-react-flow-build
  cancel-in-progress: true

jobs:
  build-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:offline
      - name: Commit generated offline app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Telecom_Block_Diagram_Maker_ReactFlow_Offline.html
          if git diff --cached --quiet; then
            echo "Offline bundle already up to date."
          else
            git commit -m "Build offline React Flow app [skip ci]"
            git push
          fi
